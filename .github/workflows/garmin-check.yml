name: garmin-check
on: workflow_dispatch          # csak kézi indítás a tesztfázisban
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install garminconnect
      - run: python ci_check.py
        env:
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
